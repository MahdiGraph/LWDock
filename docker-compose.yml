services:
  leaseweb-dock:
    image: ghcr.io/mahdigraph/lwdock:latest
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    container_name: leaseweb-dock
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Encrypts the API key and proxy password at rest. Keep it safe and never change it,
      # or the saved secrets have to be entered again. Generated by install.sh.
      APP_SECRET: ${APP_SECRET:-}
      # auto | true | false. "auto" marks cookies Secure when the request came over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
    volumes:
      - lwdock-data:/data

volumes:
  lwdock-data:

name: Bug report
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please never paste API keys, passwords or real IP addresses here.
        Security problems go to the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Include the exact error text.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings
        2. Press Test next to an account
        3. ...
  - type: dropdown
    id: product
    attributes:
      label: Leaseweb product
      options:
        - Dedicated server
        - Public Cloud instance
        - VPS
        - Not about a server
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - One-line installer
        - Docker Compose by hand
        - From source
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you run, or the image digest from `docker image inspect ghcr.io/mahdigraph/lwdock`.
  - type: dropdown
    id: proxy
    attributes:
      label: Outbound proxy
      options:
        - Off
        - SOCKS5 / SOCKS5h
        - SOCKS4
        - HTTP or HTTPS
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker logs leaseweb-dock --tail 100`, with secrets removed.
      render: text
